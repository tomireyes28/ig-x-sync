name: Instagram to X Sync

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no X publication or state commits)'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: ig-x-sync-state
  cancel-in-progress: false

jobs:
  sync:
    # One authoritative state branch. Scheduling is opt-in via a repository variable.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || vars.SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      STATE_PUSH_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Checkout current state branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Run synchronization
        id: sync
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v25.0' }}
          IG_ACCOUNT_IDS: ${{ secrets.IG_ACCOUNT_IDS }}
          IG_MN_AGENT_ID: ${{ secrets.IG_MN_AGENT_ID }}
          IG_MN_FEDERAL_ID: ${{ secrets.IG_MN_FEDERAL_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: npm start

      - name: Back up state after live execution
        if: >-
          always() && env.DRY_RUN == 'false' &&
          (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure' || steps.sync.outcome == 'cancelled')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sync-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/sync-state.json
          retention-days: 7
          if-no-files-found: error

      - name: Persist state even after partial failures
        if: >-
          always() && env.DRY_RUN == 'false' &&
          (steps.sync.outcome == 'success' || steps.sync.outcome == 'failure' || steps.sync.outcome == 'cancelled')
        run: node dist/checkpoint.js
